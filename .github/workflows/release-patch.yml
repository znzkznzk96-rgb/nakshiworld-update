name: Build and publish game patch
on:
  push:
    branches: [main, codex/r2-migration]
    paths: ['game/**', 'automation/**', '.github/workflows/release-patch.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
      - name: Recover original assets and overlay maintained source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/znzkznzk96-rgb/nakshiworld-update/releases/download/v0.70/game-source.zip -o "$RUNNER_TEMP/base-source.zip"
          echo "43b185e7ba31234bf8736b9da8c97429e962ae24608c055e52cbe6f924274427  $RUNNER_TEMP/base-source.zip" | sha256sum -c -
          python3 automation/restore_source.py "$RUNNER_TEMP/base-source.zip" "$RUNNER_TEMP/project"
          python3 automation/prepare_release.py "$RUNNER_TEMP/release-notes.md"
          git diff --exit-code -- game/addons/reservoir/release_notes.gd
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path "$RUNNER_TEMP/project" --import > "$RUNNER_TEMP/import.log" 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Verify equipment, saves and twelve animated lessons
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/testdata" "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --script tests/equipment_verify.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          grep -F 'VERIFY failures=[]' "$RUNNER_TEMP/tests.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed' "$RUNNER_TEMP/tests.log"; then exit 1; fi
      - name: Verify visual particle budgets for all grades and actions
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/visual-testdata" "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --script tests/visual_verify.gd 2>&1 | tee "$RUNNER_TEMP/visual-tests.log"
          grep -F 'VISUAL_VERIFY failures=[]' "$RUNNER_TEMP/visual-tests.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed' "$RUNNER_TEMP/visual-tests.log"; then exit 1; fi
      - name: Verify guide, release mail and regional purchases
        shell: bash
        run: |
          set -euo pipefail
          for suite in rod_aura atmosphere_encounter angler_scene market_reader odds_rewards guide shop audio_save bundle_preview rewards reader fish_surface regional inventory_layout bag_list bundles_buyback owner_gauge reservoir_layers; do
            XDG_DATA_HOME="$RUNNER_TEMP/$suite-testdata" timeout 90 "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --script "tests/${suite}_verify.gd" > "$RUNNER_TEMP/$suite-tests.log" 2>&1
            cat "$RUNNER_TEMP/$suite-tests.log"
            grep -F 'VERIFY failures=[]' "$RUNNER_TEMP/$suite-tests.log"
            if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' "$RUNNER_TEMP/$suite-tests.log"; then exit 1; fi
          done
      - name: Export patch and matching manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --export-pack Android "$GITHUB_WORKSPACE/dist/patch.pck" > "$RUNNER_TEMP/export.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,pathlib,os,zipfile
          p=pathlib.Path('dist/patch.pck')
          assert p.read_bytes()[:4]==b'GDPC' and p.stat().st_size>1000000
          v=json.loads(pathlib.Path('automation/release.json').read_text())
          assert isinstance(v['code'],int) and v['code']>60
          v.update(sha256=hashlib.sha256(p.read_bytes()).hexdigest(),size=p.stat().st_size,source_commit=os.environ["GITHUB_SHA"])
          pathlib.Path('dist/version.json').write_text(json.dumps(v,indent=2)+'\n')
          project=pathlib.Path(os.environ['RUNNER_TEMP'])/'project'
          with zipfile.ZipFile('dist/game-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in project.rglob('*'):
                  rel=item.relative_to(project)
                  if item.is_file() and '.godot' not in rel.parts and item.suffix!='.log':
                      assert 'keystore' not in item.name.lower()
                      z.write(item,pathlib.Path('game')/rel)
          PY
      - name: Verify new art from the exported pack in an empty project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack-check"
          python3 - <<'PYCODE'
          import os,pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'pack-check/project.godot').write_text('config_version=5\n[application]\nconfig/name="Packed art check"\n')
          PYCODE
          "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/pack-check" --script "$GITHUB_WORKSPACE/automation/verify_packed_art.gd" -- "$GITHUB_WORKSPACE/dist/patch.pck" > "$RUNNER_TEMP/packed-art.log" 2>&1
          cat "$RUNNER_TEMP/packed-art.log"
          grep -F 'PACKED_ANGLER_VERIFY failures=[]' "$RUNNER_TEMP/packed-art.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' "$RUNNER_TEMP/packed-art.log"; then exit 1; fi
      - name: Publish only after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(python3 -c 'import json;print("v"+json.load(open("dist/version.json"))["name"])')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false ] && git diff --quiet "$TAG" HEAD -- game automation/release.json; then
              echo "This source version is already published; no changes required."
              exit 0
            fi
            echo "Version exists with different source or an unfinished draft; increment the version or inspect the draft."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "낚시월드 $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$TAG" dist/patch.pck dist/version.json dist/game-source.zip
          gh release edit "$TAG" --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-evidence
          path: |
            dist/version.json
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/export.log
