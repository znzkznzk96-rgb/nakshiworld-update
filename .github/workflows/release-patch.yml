name: Build and publish game patch
on:
  push:
    branches: [main, codex/r2-migration]
    paths: ['game/**', 'automation/**', '.github/workflows/release-patch.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: game-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Publish identical verified candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 automation/release_candidate.py publish --out dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-result
          path: dist/PUBLISH_RESULT.json
