name: Verify work branch without deployment
on:
  push:
    branches: [work/valley-runtime, work/skills-105, work/valley-clarity-106, work/tile-release-107, work/forge-138]
    paths: ['automation/release.json', 'automation/verification-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-work-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop stale running verifications from this work branch only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 automation/cancel_stale_work_runs.py
  verify:
    needs: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded tools and baseline source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: tools-godot4.4.1-v1.45-e069c20c
      - name: Restore verified v1.45 source and overlay
        shell: bash
        run: |
          set -euo pipefail
          echo "VERIFICATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dl" evidence
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil > /dev/null
          [ -f "$RUNNER_TEMP/dl/source.zip" ] || curl -fL --retry 2 https://github.com/znzkznzk96-rgb/nakshiworld-update/releases/download/v1.45/game-source.zip -o "$RUNNER_TEMP/dl/source.zip"
          echo "e069c20cd38ee491d0ef2e6c88d01353bee7b038b4628cfb8ecc1ccc39813c62  $RUNNER_TEMP/dl/source.zip" | sha256sum -c -
          python3 automation/restore_source.py "$RUNNER_TEMP/dl/source.zip" "$RUNNER_TEMP/project"
          [ -f "$RUNNER_TEMP/dl/godot.zip" ] || curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o "$RUNNER_TEMP/dl/godot.zip"
          unzip -q "$RUNNER_TEMP/dl/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
      - name: Import resources and check script errors
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          timeout 240 "$GODOT" --headless --path "$RUNNER_TEMP/project" --import > evidence/import.log 2>&1 || true
          if grep -E 'SCRIPT ERROR:|Parse Error' evidence/import.log; then exit 1; fi
      - name: Quick checks - boot, save and load, updater
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-boot" timeout 60 "$GODOT" --headless --path "$RUNNER_TEMP/project" --quit-after 180 > evidence/boot.log 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error' evidence/boot.log; then cat evidence/boot.log; exit 1; fi
          for pair in audio_save:AUDIO_SAVE_VERIFY expedition_save:EXPEDITION_SAVE_VERIFY updater:UPDATER_VERIFY updater_smoothness:UPDATER_SMOOTHNESS_VERIFY; do
            suite="${pair%%:*}"; tag="${pair##*:}"
            XDG_DATA_HOME="$RUNNER_TEMP/isolated-$suite" timeout 90 "$GODOT" --headless --path "$RUNNER_TEMP/project" --script "tests/${suite}_verify.gd" > "evidence/$suite.log" 2>&1 || { cat "evidence/$suite.log"; exit 1; }
            grep -F "$tag failures=[]" "evidence/$suite.log"
            if grep -E 'SCRIPT ERROR:|Assertion failed' "evidence/$suite.log"; then exit 1; fi
          done
      - name: Build and validate reusable release candidate
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          start=$(date +%s)
          python3 automation/test_release_candidate.py
          mkdir -p candidate "$RUNNER_TEMP/candidate-pack-check"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          python3 automation/prepare_release.py
          git diff --exit-code -- game/addons/reservoir/release_notes.gd
          timeout 120 "$GODOT" --headless --path "$RUNNER_TEMP/project" --export-pack Android "$GITHUB_WORKSPACE/candidate/full.pck" > evidence/candidate-export.log 2>&1
          python3 automation/release_candidate.py seal --project "$RUNNER_TEMP/project" --out candidate
          echo 'config_version=5' > "$RUNNER_TEMP/candidate-pack-check/project.godot"
          version=$(python3 -c 'import json;print(json.load(open("automation/release.json"))["name"])')
          timeout 90 "$GODOT" --headless --path "$RUNNER_TEMP/candidate-pack-check" --script "$GITHUB_WORKSPACE/automation/verify_packed_art.gd" -- "$GITHUB_WORKSPACE/candidate/full.pck" "$version" > evidence/candidate-pack.log 2>&1
          grep -F 'PACKED_ANGLER_VERIFY failures=[]' evidence/candidate-pack.log
          timeout 90 "$GODOT" --headless --path "$RUNNER_TEMP/candidate-pack-check" --script "$GITHUB_WORKSPACE/automation/verify_packed_tile.gd" -- "$GITHUB_WORKSPACE/candidate/full.pck" > evidence/candidate-tile.log 2>&1
          grep -F 'PACKED_TILE107_VERIFY failures=[]' evidence/candidate-tile.log
          timeout 90 "$GODOT" --headless --path "$RUNNER_TEMP/candidate-pack-check" --script "$GITHUB_WORKSPACE/automation/verify_packed_rift.gd" -- "$GITHUB_WORKSPACE/candidate/full.pck" > evidence/candidate-rift.log 2>&1
          grep -F 'PACKED_RIFT_ART_VERIFY failures=[]' evidence/candidate-rift.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/candidate-*.log; then exit 1; fi
          python3 -c 'import json,os;d=json.load(open("candidate/candidate.json"));open(os.environ["GITHUB_ENV"],"a").write("CANDIDATE_ARTIFACT=release-candidate-"+d["input_fingerprint"]+"\n")'
          echo "candidate_build_seconds=$(( $(date +%s) - start ))" >> evidence/stage-timings.txt
      - name: Preserve exact tested release candidate
        uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: candidate/
          retention-days: 30
      - name: Record verification step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 automation/ci_timings.py --output evidence/ci-timings.json
      - name: Preserve verification logs
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: work-verification
          path: evidence/



