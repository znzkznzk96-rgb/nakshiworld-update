name: Verify work branch without deployment
on:
  push:
    branches: [work/valley-runtime, work/skills-105, work/valley-clarity-106, work/tile-release-107]
    paths: ['game/**', 'automation/**', '.github/workflows/verify-work.yml']
permissions:
  contents: read
concurrency:
  group: verify-work-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop stale running verifications from this work branch only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 automation/cancel_stale_work_runs.py
  verify:
    needs: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified v1.32 source and overlay
        shell: bash
        run: |
          set -euo pipefail
          echo "VERIFICATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil > /dev/null
          curl -fL --retry 2 https://github.com/znzkznzk96-rgb/nakshiworld-update/releases/download/v1.32/game-source.zip -o "$RUNNER_TEMP/source.zip"
          echo "eb3ea207c4a4791340f50871867a56735b4bb3a53b2ef306f64411f59792f861  $RUNNER_TEMP/source.zip" | sha256sum -c -
          python3 automation/restore_source.py "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/project"
          curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
      - name: Verify and render approved rift art integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/rift-art
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri > /dev/null
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path "$RUNNER_TEMP/project" --import > evidence/rift-import.log 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' evidence/rift-import.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-rift-art" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/rift_art_verify.gd > evidence/rift-art.log 2>&1
          grep -F 'RIFT_ART_VERIFY failures=[]' evidence/rift-art.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-rift-bundles" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/rift_bundles_layers_verify.gd > evidence/rift-bundles-layers.log 2>&1
          grep -F 'RIFT_BUNDLES_LAYERS_VERIFY failures=[]' evidence/rift-bundles-layers.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-rift-bundles" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/rift_bundles_layers_verify.gd -- --reload > evidence/rift-bundle-reload.log 2>&1
          grep -F 'RIFT_BUNDLE_RELOAD_VERIFY failures=[]' evidence/rift-bundle-reload.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-rift-layers-native" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/rift_layers_preview.gd -- "$GITHUB_WORKSPACE/evidence/rift-layers" > evidence/rift-layers-native.log 2>&1
          grep -F 'RIFT_LAYERS_PREVIEW failures=[]' evidence/rift-layers-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/rift-bundles-layers.log evidence/rift-layers-native.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-rift-unlock-native" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/rift_unlock_preview.gd -- "$GITHUB_WORKSPACE/evidence/rift-art/unlock" > evidence/rift-unlock-native.log 2>&1
          grep -F 'RIFT_UNLOCK_PREVIEW failures=[]' evidence/rift-unlock-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/rift-unlock-native.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-rift-native" timeout 120 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/rift_art_preview.gd -- "$GITHUB_WORKSPACE/evidence/rift-art" > evidence/rift-native.log 2>&1
          grep -F 'RIFT_ART_PREVIEW failures=[]' evidence/rift-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/rift-art.log evidence/rift-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: rift-art-first-preview
          path: |
            evidence/rift-art/
            evidence/rift-art.log
            evidence/rift-native.log
            evidence/rift-layers/
            evidence/rift-bundles-layers.log
            evidence/rift-layers-native.log
      - name: Verify and render measured record photo first
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          for suite in record_photo record_gallery record_photo_motion; do
            XDG_DATA_HOME="$RUNNER_TEMP/isolated-$suite" timeout 90 "$GODOT" --headless --path "$RUNNER_TEMP/project" --script "tests/${suite}_verify.gd" > "evidence/${suite}.log" 2>&1
            grep -F 'failures=[]' "evidence/${suite}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Assertion failed|ERROR:' "evidence/${suite}.log"; then exit 1; fi
          done
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-record-photo-native" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/record_photo_preview.gd -- "$GITHUB_WORKSPACE/evidence/record-photo" > evidence/record-photo-native.log 2>&1
          grep -F 'RECORD_PHOTO_PREVIEW failures=[]' evidence/record-photo-native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Assertion failed|ERROR:' evidence/record-photo-native.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-record-motion-native" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/record_photo_motion_preview.gd -- "$GITHUB_WORKSPACE/evidence/record-motion" > evidence/record-motion-native.log 2>&1
          grep -F 'RECORD_PHOTO_MOTION_PREVIEW failures=[]' evidence/record-motion-native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Assertion failed|ERROR:' evidence/record-motion-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-photo-first-preview
          compression-level: 0
          path: |
            evidence/record-photo/
            evidence/record-motion/
            evidence/record_photo_motion.log
            evidence/record-motion-native.log
            evidence/record_photo.log
            evidence/record_gallery.log
            evidence/record-photo-native.log
      - name: Verify native bobber contact and bounded fish previews
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-bite-contact-native" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/bite_contact_preview.gd -- "$GITHUB_WORKSPACE/evidence/bite-contact" > evidence/bite-contact-native.log 2>&1
          grep -F 'BITE_CONTACT_PREVIEW failures=[]' evidence/bite-contact-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/bite-contact-native.log; then exit 1; fi
      - name: Compare village layer quality at phone size
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          cp "$RUNNER_TEMP/project/village.gd" "$RUNNER_TEMP/village-after.gd"
          cp "$RUNNER_TEMP/project/addons/reservoir/village_life.gd" "$RUNNER_TEMP/life-after.gd"
          git fetch --depth=1 origin 594cd461f6c57e0dd0746e422d36f737cea240ef
          git show 594cd461f6c57e0dd0746e422d36f737cea240ef:game/village.gd > "$RUNNER_TEMP/project/village.gd"
          git show 594cd461f6c57e0dd0746e422d36f737cea240ef:game/addons/reservoir/village_life.gd > "$RUNNER_TEMP/project/addons/reservoir/village_life.gd"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-layer-before" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/village_layers_quality_preview.gd -- "$GITHUB_WORKSPACE/evidence/village-quality/before" > evidence/village-quality-before.log 2>&1
          cp "$RUNNER_TEMP/village-after.gd" "$RUNNER_TEMP/project/village.gd"
          cp "$RUNNER_TEMP/life-after.gd" "$RUNNER_TEMP/project/addons/reservoir/village_life.gd"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-layer-after" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/village_layers_quality_preview.gd -- "$GITHUB_WORKSPACE/evidence/village-quality/after" > evidence/village-quality-after.log 2>&1
          grep -F 'VILLAGE_LAYERS_QUALITY_PREVIEW screens=120' evidence/village-quality-before.log evidence/village-quality-after.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/village-quality-before.log evidence/village-quality-after.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: village-quality-first-preview
          compression-level: 0
          path: |
            evidence/village-quality/
            evidence/village-quality-before.log
            evidence/village-quality-after.log
      - name: Render village life layers and passenger motion
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-village-life131-native" timeout 180 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/village_life131_preview.gd -- "$GITHUB_WORKSPACE/evidence/village-life131" > evidence/village-life131-native.log 2>&1
          grep -F 'VILLAGE_LIFE131_PREVIEW failures=[]' evidence/village-life131-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/village-life131-native.log; then exit 1; fi
      - name: Render updater checking download and circular chase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri > /dev/null
          "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --editor --path "$RUNNER_TEMP/project" --import > evidence/import.log 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' evidence/import.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-fish-grade-aura-native" timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/fish_grade_aura_preview.gd -- "$GITHUB_WORKSPACE/evidence/fish-grade-aura" > evidence/fish-grade-aura-native.log 2>&1
          grep -F 'FISH_GRADE_AURA_PREVIEW failures=[]' evidence/fish-grade-aura-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/fish-grade-aura-native.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-updater" "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --script tests/updater_verify.gd > evidence/updater.log 2>&1
          grep -F 'UPDATER_VERIFY failures=[]' evidence/updater.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/updater.log; then exit 1; fi
          curl -fL https://github.com/znzkznzk96-rgb/nakshiworld-update/releases/download/v1.18/patch.pck -o "$RUNNER_TEMP/patch118.pck"
          echo "cf592988a1e8f372cc37d6ef3a4fe3041b6e92a07b40fce509baeb8a3dcfb2a3  $RUNNER_TEMP/patch118.pck" | sha256sum -c -
          curl -fL https://github.com/znzkznzk96-rgb/nakshiworld-update/releases/download/v1.17/patch.pck -o "$RUNNER_TEMP/patch117.pck"
          echo "e9a75c55db6b5df873595892b6ab8ccadbab0351277d4027eba2074c561c71b6  $RUNNER_TEMP/patch117.pck" | sha256sum -c -
          python3 - <<'PY'
          import json,urllib.request
          base='https://nakshiworld-update-kr.znzkznzk96.workers.dev'
          with urllib.request.urlopen(urllib.request.Request(base+'/version.json',headers={'User-Agent':'GodotEngine/4.4.1.stable.official (Linux)'}),timeout=60) as r: live=json.load(r)
          url=base+'/patch.pck?v='+str(live['code'])
          with urllib.request.urlopen(urllib.request.Request(url,headers={'Range':'bytes=0-99','Accept-Encoding':'identity','User-Agent':'GodotEngine/4.4.1.stable.official (Linux)'}),timeout=60) as r:
              data=r.read()
              assert r.status==206 and len(data)==100 and r.headers.get('Content-Range')=='bytes 0-99/'+str(live['size'])
              print('LIVE_INCREMENTAL_RANGE_VERIFY failures=[]')
          PY
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-incremental" "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --script tests/incremental_verify.gd -- "$RUNNER_TEMP/patch118.pck" > evidence/incremental.log 2>&1
          grep -F 'INCREMENTAL_VERIFY failures=[]' evidence/incremental.log
          python3 docs/qa/updater-incremental/range_server.py "$RUNNER_TEMP/patch118.pck" &
          RANGE_PID=$!
          trap 'kill "$RANGE_PID" || true' EXIT
          python3 - <<'PYREADY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18765/stats',timeout=1) as r: assert r.status==200
                  break
              except OSError:
                  if attempt==29: raise
                  time.sleep(.1)
          print('LOCAL_RANGE_SERVER_READY')
          PYREADY
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-incremental-network" "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/project" --script tests/incremental_network_verify.gd -- http://127.0.0.1:18765/patch "$RUNNER_TEMP/patch117.pck" > evidence/incremental-network.log 2>&1 || { cat evidence/incremental-network.log; exit 1; }
          grep -F 'INCREMENTAL_NETWORK_VERIFY failures=[]' evidence/incremental-network.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-updater-preview" timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/updater_preview.gd -- "$GITHUB_WORKSPACE/evidence/updater" > evidence/updater-preview.log 2>&1
          grep -F 'UPDATER_PREVIEW failures=[]' evidence/updater-preview.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/updater-preview.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-boot-smooth" timeout 60 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/updater_smoothness_preview.gd -- "$GITHUB_WORKSPACE/evidence/boot-smooth" > evidence/boot-smooth-native.log 2>&1
          grep -F 'UPDATER_SMOOTHNESS_PREVIEW failures=[]' evidence/boot-smooth-native.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-font-native" timeout 60 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/updater_font_verify.gd -- "$GITHUB_WORKSPACE/evidence/updater-font" > evidence/updater-font-native.log 2>&1
          grep -F 'UPDATER_FONT_VERIFY failures=[] native=true raster_cases=4' evidence/updater-font-native.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/updater-font-native.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/boot-smooth-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: updater-first-preview
          path: |
            evidence/updater/
            evidence/updater.log
            evidence/updater-preview.log
      - name: Verify all six owner gauge layouts before full checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-owner-alignment" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/owner_gauge_verify.gd > evidence/owner-alignment.log 2>&1
          grep -F 'OWNER_GAUGE_VERIFY failures=[]' evidence/owner-alignment.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-owner-alignment-preview" timeout 90 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/owner_gauge_preview.gd -- "$GITHUB_WORKSPACE/evidence/owner-alignment" > evidence/owner-alignment-preview.log 2>&1
          grep -F 'OWNER_GAUGE_PREVIEW complete' evidence/owner-alignment-preview.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/owner-alignment*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: owner-gauge-first-preview
          path: |
            evidence/owner-alignment/
            evidence/owner-alignment*.log
      - name: Verify and render village reward notice before full checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-village-reward" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/village_reward_notice_verify.gd > evidence/village-reward.log 2>&1
          grep -F 'VILLAGE_REWARD_NOTICE_VERIFY failures=[]' evidence/village-reward.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-village-reward-preview" timeout 90 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/notification091_preview.gd -- "$GITHUB_WORKSPACE/evidence/village-reward" > evidence/village-reward-preview.log 2>&1
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/village-reward*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: village-reward-first-preview
          path: |
            evidence/village-reward/
            evidence/village-reward*.log
      - name: Verify and preview per-soldier skill feedback first
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-skill-cues" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/soldier_skill_cues_verify.gd > evidence/soldier-skill-cues.log 2>&1
          grep -F 'SOLDIER_SKILL_CUES_VERIFY failures=[]' evidence/soldier-skill-cues.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-skill-parity" "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/soldier_skill_cues_parity.gd -- "$RUNNER_TEMP/project/tests/soldier_skill_cues_baseline.json" verify > evidence/soldier-skill-parity.log 2>&1
          grep -F 'SOLDIER_SKILL_PARITY_VERIFY failures=[]' evidence/soldier-skill-parity.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-skill-preview" timeout 90 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/soldier_skill_cues_preview.gd -- "$GITHUB_WORKSPACE/evidence/soldier-skills" > evidence/soldier-skill-preview.log 2>&1
          grep -F 'SOLDIER_SKILL_CUES_PREVIEW failures=[]' evidence/soldier-skill-preview.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-soldier-size" timeout 90 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/soldier_size_preview.gd -- "$GITHUB_WORKSPACE/evidence/soldier-size" > evidence/soldier-size-preview.log 2>&1
          grep -F 'SOLDIER_SIZE_PREVIEW failures=[]' evidence/soldier-size-preview.log
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-tier2-body" timeout 90 xvfb-run -a "$GODOT" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/tier2_body_preview.gd -- "$GITHUB_WORKSPACE/evidence/tier2-body" > evidence/tier2-body-preview.log 2>&1
          grep -F 'TIER2_BODY_PREVIEW failures=[]' evidence/tier2-body-preview.log
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/tier2-body-preview.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/soldier-size-preview.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/soldier-skill-cues.log evidence/soldier-skill-parity.log evidence/soldier-skill-preview.log; then exit 1; fi
      - name: Render revised formation scroll and PixelLab roles
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/isolated-formation" timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path "$RUNNER_TEMP/project" --script tests/formation_scroll_preview.gd -- "$GITHUB_WORKSPACE/evidence/formation" > evidence/formation.log 2>&1
          if grep -E 'SCRIPT ERROR:|Assertion failed|ERROR:' evidence/formation.log; then cat evidence/formation.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          compression-level: 0
          name: soldier-skills-first-preview
          path: |
            evidence/fish-grade-aura/
            evidence/fish-grade-aura-native.log
            evidence/formation/
            evidence/formation.log
            evidence/soldier-skills/
            evidence/soldier-skill-cues.log
            evidence/soldier-skill-parity.log
            evidence/soldier-skill-preview.log
      - name: Import and full regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path "$RUNNER_TEMP/project" --script tests/bake_expedition_assets.gd > evidence/bake.log 2>&1
          grep -F 'EXPEDITION_BAKE files=130' evidence/bake.log
